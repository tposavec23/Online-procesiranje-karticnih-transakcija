name: CI

on:
  pull_request:
  push:
    branches: [develop, main]

permissions:
  contents: read

# Novi commit u istom PR-u otkazuje stari run tog PR-a; različiti PR-ovi rade neovisno jedan o drugome;
# svaki push u develop i main radi do kraja
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  go-service:
    name: go (${{ matrix.service }})
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        service: [account, catalogue, transaction, bank-communication, bank-simulator]
    defaults:
      run:
        working-directory: services/${{ matrix.service }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: services/${{ matrix.service }}/go.mod
          cache-dependency-path: services/${{ matrix.service }}/go.mod
      - run: go build ./...
      # go vet je službeni Go alat za statičku analizu koda
      - run: go vet ./...
      - run: go test ./...
      # gofmt je službeni i preporučeni Go alat za formatiranje koda; korak pada ako neki fajl nije formatiran
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "Ovi fajlovi nisu formatirani, u mapi servisa pokreni: gofmt -w ."
            echo "$unformatted"
            exit 1
          fi

  go:
    needs: go-service
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - run: test "${{ needs.go-service.result }}" = success
